# Contrato /v1 usado por la app móvil.
# Derivado del código de `lavi-admin` (rama claude/pensive-fermi-fzsq8u, esquemas zod de backend/src/app/v1/**
# y respuestas de backend/src/lib/*). El backend aún NO publica un OpenAPI: cuando lo haga, esa especificación
# reemplaza este archivo (`npm run api:generate`) y manda ante cualquier diferencia.
openapi: 3.0.3
info:
  title: Lavi API (app móvil)
  version: 1.0.0-derivado
servers:
  - url: http://localhost:4010
security:
  - bearerAuth: []
paths:
  /v1/config/app:
    get:
      operationId: getAppConfig
      security: []
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/AppConfig" } } } }
  /v1/auth/session:
    post:
      operationId: createSession
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/CreateSessionRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Session" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteSession
      parameters:
        - { name: X-Refresh-Token, in: header, required: true, schema: { type: string } }
      responses:
        "204": { description: Sesión cerrada }
        default: { $ref: "#/components/responses/Error" }
  /v1/auth/refresh:
    post:
      operationId: refreshSession
      security: []
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [refresh_token], properties: { refresh_token: { type: string } } } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Tokens" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/devices:
    post:
      operationId: registerDevice
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/RegisterDeviceRequest" } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { type: object, required: [id], properties: { id: { type: string } } } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/devices/{id}:
    delete:
      operationId: deleteDevice
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "204": { description: Eliminado }
  /v1/me:
    get:
      operationId: getMe
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
    patch:
      operationId: updateMe
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/UpdateMeRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Me" } } } }
        default: { $ref: "#/components/responses/Error" }
    delete:
      operationId: deleteMe
      responses:
        "204": { description: Cuenta eliminada }
  /v1/scans:
    post:
      operationId: createScan
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ScanRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/ScanResponse" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/treatments:
    get:
      operationId: listTreatments
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [treatments], properties: { treatments: { type: array, items: { $ref: "#/components/schemas/TreatmentSummary" } } } } } } }
    post:
      operationId: activateTreatment
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ActivateTreatmentRequest" } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Treatment" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/treatments/{id}:
    get:
      operationId: getTreatment
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Treatment" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/treatments/{id}/schedule:
    patch:
      operationId: changeSchedule
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody:
        required: true
        content: { application/json: { schema: { $ref: "#/components/schemas/ChangeScheduleRequest" } } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Treatment" } } } }
        default: { $ref: "#/components/responses/Error" }
  /v1/points:
    get:
      operationId: getPoints
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/Points" } } } }
  /v1/points/ledger:
    get:
      operationId: listLedger
      parameters:
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 30 } }
        - { name: before, in: query, schema: { type: string } }
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/LedgerPage" } } } }
  /v1/redemptions/options:
    get:
      operationId: listRedemptionOptions
      responses:
        "200": { description: OK, content: { application/json: { schema: { $ref: "#/components/schemas/RedemptionOptions" } } } }
  /v1/redemptions:
    get:
      operationId: listRedemptions
      responses:
        "200": { description: OK, content: { application/json: { schema: { type: object, required: [redemptions], properties: { redemptions: { type: array, items: { $ref: "#/components/schemas/Redemption" } } } } } } }
    post:
      operationId: createRedemption
      parameters:
        - { name: Idempotency-Key, in: header, required: true, schema: { type: string, minLength: 8, maxLength: 128 } }
      requestBody:
        required: true
        content: { application/json: { schema: { type: object, required: [option_id], properties: { option_id: { type: string, format: uuid } } } } }
      responses:
        "201": { description: Creado, content: { application/json: { schema: { $ref: "#/components/schemas/Redemption" } } } }
        default: { $ref: "#/components/responses/Error" }
components:
  securitySchemes:
    bearerAuth: { type: http, scheme: bearer }
  parameters:
    Id: { name: id, in: path, required: true, schema: { type: string } }
  responses:
    Error:
      description: Error
      content: { application/json: { schema: { $ref: "#/components/schemas/ApiError" } } }
  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [code, message]
          additionalProperties: true
          properties: { code: { type: string }, message: { type: string } }
    AppConfig:
      type: object
      required: [min_app_version]
      properties:
        min_app_version: { type: string, example: "1.0.0" }
        notification_texts:
          type: object
          additionalProperties: { type: string }
          description: "Claves: reminder_title, reminder_body, nudge_body, backup_title, backup_body, repurchase_title, repurchase_body. Admiten {product}."
        settings:
          type: object
          properties:
            point_value_cop: { type: number }
            min_points_to_redeem: { type: integer }
            points_expiration_days: { type: integer }
            offline_scan_max_hours: { type: integer }
            allow_parallel_treatments: { type: boolean }
        links:
          type: object
          properties:
            ios_store_url: { type: string }
            android_store_url: { type: string }
            app_domain: { type: string }
    CreateSessionRequest:
      type: object
      required: [shopify_access_token]
      properties:
        shopify_access_token: { type: string }
        timezone: { type: string }
        data_consent: { type: boolean }
    Tokens:
      type: object
      required: [access_token, refresh_token]
      properties:
        access_token: { type: string }
        refresh_token: { type: string }
        expires_in: { type: integer }
    Session:
      allOf:
        - $ref: "#/components/schemas/Tokens"
        - type: object
          required: [user_id, needs_data_consent]
          properties:
            user_id: { type: string }
            needs_data_consent: { type: boolean }
    RegisterDeviceRequest:
      type: object
      required: [push_token, platform]
      properties:
        push_token: { type: string }
        platform: { type: string, enum: [ios, android] }
    Me:
      type: object
      required: [id, timezone, balance]
      properties:
        id: { type: string }
        email: { type: string, nullable: true }
        name: { type: string, nullable: true }
        phone: { type: string, nullable: true }
        timezone: { type: string, example: America/Bogota }
        data_consent_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
        balance: { type: integer }
    UpdateMeRequest:
      type: object
      properties:
        name: { type: string }
        timezone: { type: string }
        accept_data_policy: { type: boolean, enum: [true] }
    Product:
      type: object
      required: [id, name]
      properties: { id: { type: string }, name: { type: string } }
    Variant:
      type: object
      required: [id, name]
      properties:
        id: { type: string }
        name: { type: string }
        volume_ml: { type: number, nullable: true }
        shopify_variant_id: { type: string, nullable: true }
    DoseWindow:
      type: object
      required: [id, window_start, window_end]
      properties:
        id: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
    Dose:
      type: object
      required: [id, window_start, window_end, status]
      properties:
        id: { type: string }
        window_start: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        status: { type: string, enum: [scheduled, on_time, late, missed] }
        recorded_at: { type: string, format: date-time, nullable: true }
    TreatmentConfig:
      type: object
      properties:
        id: { type: string }
        version: { type: integer }
        doses_per_day: { type: integer }
        duration_days: { type: integer }
        points_per_dose: { type: integer }
        window_minutes_before: { type: integer }
        window_minutes_after: { type: integer }
        reminder_nudges: { type: array, items: { type: integer }, description: "Minutos desde la apertura de la ventana en que se insiste" }
        schedule_change_min_notice_hours: { type: integer }
        schedule_change_max_count: { type: integer }
        schedule_change_period_days: { type: integer }
    TreatmentSummary:
      type: object
      required: [id, status, product, variant, reminder_times, start_date, end_date, progress, schedule_changes_left, days_left, repurchase_suggested]
      properties:
        id: { type: string }
        tag_uid: { type: string }
        status: { type: string, enum: [active, finished, cancelled] }
        start_date: { type: string, format: date }
        end_date: { type: string, format: date }
        reminder_times: { type: array, items: { type: string, example: "08:00" } }
        points_earned: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
        variant: { $ref: "#/components/schemas/Variant" }
        config: { $ref: "#/components/schemas/TreatmentConfig" }
        progress:
          type: object
          required: [total, on_time, late, missed]
          properties: { total: { type: integer }, on_time: { type: integer }, late: { type: integer }, missed: { type: integer } }
        schedule_changes_left: { type: integer }
        days_left: { type: integer }
        repurchase_suggested: { type: boolean }
        created_at: { type: string, format: date-time }
        finished_at: { type: string, format: date-time, nullable: true }
    Treatment:
      allOf:
        - $ref: "#/components/schemas/TreatmentSummary"
        - type: object
          required: [doses]
          properties:
            doses: { type: array, items: { $ref: "#/components/schemas/Dose" } }
    ActivateTreatmentRequest:
      type: object
      required: [activation_token]
      properties:
        activation_token: { type: string }
        reminder_times: { type: array, items: { type: string } }
        start_date: { type: string, format: date }
    ChangeScheduleRequest:
      type: object
      required: [reminder_times]
      properties: { reminder_times: { type: array, minItems: 1, items: { type: string } } }
    ScanRequest:
      type: object
      required: [tag_url]
      properties:
        tag_url: { type: string }
        device_time: { type: string, format: date-time, description: ISO 8601 con zona }
        offline: { type: boolean }
    ScanResponse:
      type: object
      required: [result]
      properties:
        # `result` es abierto a propósito: la app tolera valores desconocidos.
        result:
          type: string
          enum: [activation_required, dose_recorded, too_early, late, no_pending_dose, treatment_finished, rejected]
        reason: { type: string, enum: [invalid_signature, replayed, owned_by_other, blocked, offline_expired] }
        idempotent_replay: { type: boolean }
        activation_token: { type: string }
        expires_in: { type: integer }
        product: { $ref: "#/components/schemas/Product" }
        variant: { $ref: "#/components/schemas/Variant" }
        suggested_times: { type: array, items: { type: string } }
        config: { $ref: "#/components/schemas/TreatmentConfig" }
        dose_id: { type: string }
        points_earned: { type: integer }
        bonus_points: { type: integer }
        streak: { type: integer }
        balance: { type: integer }
        next_dose: { allOf: [{ $ref: "#/components/schemas/DoseWindow" }], nullable: true }
        treatment_completed: { type: boolean }
        opens_at: { type: string, format: date-time }
        window_end: { type: string, format: date-time }
        treatment_id: { type: string, nullable: true }
        repurchase_suggested: { type: boolean }
    Points:
      type: object
      required: [balance]
      properties:
        balance: { type: integer }
        value_cop: { type: number }
        upcoming_expirations:
          type: array
          items: { type: object, required: [date, amount], properties: { date: { type: string, format: date }, amount: { type: integer } } }
    LedgerEntry:
      type: object
      required: [id, amount, reason, created_at]
      properties:
        id: { type: string }
        amount: { type: integer, description: "Positivo abona, negativo descuenta" }
        reason: { type: string }
        reference_type: { type: string, nullable: true }
        expires_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
    LedgerPage:
      type: object
      required: [entries]
      properties:
        entries: { type: array, items: { $ref: "#/components/schemas/LedgerEntry" } }
        next_before: { type: string, nullable: true }
    RedemptionOption:
      type: object
      required: [id, name, points_cost, reward_type, affordable]
      properties:
        id: { type: string }
        name: { type: string }
        points_cost: { type: integer }
        reward_type: { type: string, enum: [fixed_amount, percentage, free_product, free_shipping] }
        reward_value: { type: number, nullable: true }
        affordable: { type: boolean }
    RedemptionOptions:
      type: object
      required: [balance, min_points_to_redeem, options]
      properties:
        balance: { type: integer }
        min_points_to_redeem: { type: integer }
        options: { type: array, items: { $ref: "#/components/schemas/RedemptionOption" } }
    Redemption:
      type: object
      required: [id, option_id, option_name, status, points, created_at]
      properties:
        id: { type: string }
        option_id: { type: string }
        option_name: { type: string }
        reward_type: { type: string }
        points: { type: integer }
        code: { type: string, nullable: true }
        status: { type: string, enum: [pending, issued, used, expired, failed] }
        expires_at: { type: string, format: date-time, nullable: true }
        used_at: { type: string, format: date-time, nullable: true }
        created_at: { type: string, format: date-time }
