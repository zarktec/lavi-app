- openLink: "lavi://t?url=https%3A%2F%2Flinks-dev.lavi.example%2Ft%3Fd%3Dsim_recorded%26c%3Dy"
- assertVisible: "¡Aplicación registrada!"
- tapOn: "Listo"
- openLink: "lavi://t?url=https%3A%2F%2Flinks-dev.lavi.example%2Ft%3Fd%3Dsim_replayed%26c%3Dz"
- assertVisible: "No pudimos verificar este frasco"
- tapOn: "Listo"
- openLink: "lavi://t?url=https%3A%2F%2Fotra.com%2Ft%3Fd%3Da%26c%3Db"
- assertVisible: "Este tag no pertenece a nuestros productos"
